[project]
name = "powerpath-engine"
version = "0.1.0"
description = "PowerPath barbell lift video analysis engine"
readme = "README.md"
authors = [
    { name = "Sudeep Reddy", email = "sudeep04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=18.0.0",
    "fastapi>=0.139.0",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "python-multipart>=0.0.32",
    "scipy>=1.18.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
# Uvicorn entry: serves the FastAPI app on 127.0.0.1:8400 (see api/main.py).
powerpath-api = "powerpath_engine.api.main:run"

# Optional pose-inference extras -- imported LAZILY inside the backend
# __init__s; the test suite must pass with neither installed (the global
# "no model inference in the test suite" constraint).
[project.optional-dependencies]
pose = ["rtmlib", "onnxruntime"]
mediapipe = ["mediapipe"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.156.6",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient warns to migrate httpx -> httpx2; httpx2 is not yet a
    # stable dependency we want to pull mid-build. Scoped ignore keeps test output
    # pristine without hiding any other warning. Revisit when bumping starlette/httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:",
]

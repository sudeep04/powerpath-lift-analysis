[project]
name = "powerpath-engine"
version = "0.1.0"
description = "PowerPath barbell lift video analysis engine"
readme = "README.md"
authors = [
    { name = "Sudeep Reddy", email = "sudeep04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=18.0.0",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "scipy>=1.18.0",
]

# Optional pose-inference extras -- imported LAZILY inside the backend
# __init__s; the test suite must pass with neither installed (the global
# "no model inference in the test suite" constraint).
[project.optional-dependencies]
pose = ["rtmlib", "onnxruntime"]
mediapipe = ["mediapipe"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.156.6",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
